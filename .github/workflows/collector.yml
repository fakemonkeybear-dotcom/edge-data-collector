name: Order Book Collector

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch: {}       # lets you manually trigger a run too

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - run: python collector.py

      - name: Commit collected data
        run: |
          git config user.name "collector-bot"
          git config user.email "collector-bot@users.noreply.github.com"
          git add data/
          git commit -m "data batch $(date -u +%Y%m%d_%H%M%S)" || echo "nothing to commit"
          git pull --rebase
          git push
